name: Tests only (platform MIDI mocks)

# Slim dev workflow for the platform_midi_mocks branch: builds only the TestsProcessor target and
# runs ctest on Windows / macOS / Linux, then evaluates each platform's results against its own
# known-failures allow file in-job. No plugin formats, pluginval, packaging or signing -- this
# exists purely to iterate on mock_MidiDeviceWin32.cpp / mock_MidiDeviceCoreMidi.cpp over CI.
# Migrate the mocks + the per-platform test_results matrix into build_and_test.yml once proven.

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run with tmate debugging enabled on failure'
        required: false
        default: false
  push:
    branches:
      - platform_midi_mocks

concurrency:
  group: tests-only-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  BUILD_DIR: build
  SCCACHE_GHA_ENABLED: true
  SCCACHE_CACHE_MULTIARCH: 1

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            extra-flags: -G Ninja -DJUCE_LINUX=1
            allow: Tests/known_failures.txt
            python: python3
          - name: macOS
            os: macos-14
            extra-flags: -G Ninja -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            allow: Tests/known_failures_macos.txt
            python: python3
          - name: Windows
            os: windows-2022
            extra-flags: ""
            allow: Tests/known_failures_windows.txt
            python: python

    steps:
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Clang
        if: runner.os == 'Linux'
        uses: egor-tensin/setup-clang@v1

      - name: Install JUCE's Linux Deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt install libasound2-dev libx11-dev libxinerama-dev libxext-dev libfreetype6-dev libglu1-mesa-dev ninja-build

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Use latest Xcode on system (macOS)
        if: ${{ matrix.name == 'macOS' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CtrlrX Deps
        run: |
          echo "OS: $RUNNER_OS"
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt install -y binutils-dev libboost-dev libcurl4-gnutls-dev libgl1-mesa-dev libglapi-mesa libiberty-dev libsframe1 libudev-dev libxcursor-dev libxrandr-dev xorg-dev
          elif [ "$RUNNER_OS" == "Windows" ]; then
            pushd ./Source/Misc/
            unzip boost/boost.zip
            popd
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install boost
            pushd ./Source/Misc/
            unzip boost/boost.zip
            popd
          fi

      - name: Cache the build
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: >
          cmake -B ${{ env.BUILD_DIR }}
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          ${{ matrix.extra-flags }} .

      - name: Build TestsProcessor
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }} --target TestsProcessor -j 4

      - name: Test
        continue-on-error: true
        working-directory: ${{ env.BUILD_DIR }}/Tests
        env:
          GTEST_OUTPUT: "xml:test-results/"
        run: |
          rm -rf test-results && mkdir -p test-results
          ctest -j 4 --output-on-failure -C ${{ env.BUILD_TYPE }}

      - name: Evaluate results (excluding known failures)
        run: ${{ matrix.python }} Tests/ci_check_test_results.py --allow ${{ matrix.allow }} "${{ env.BUILD_DIR }}/Tests/test-results/**/*.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: ${{ env.BUILD_DIR }}/Tests/test-results/
          if-no-files-found: warn

      - name: Setup tmate session if failed
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() && (github.event_name == 'workflow_dispatch' && inputs.debug_enabled) || (runner.debug) }}
