name: LuaJIT build (temporary)

# TEMPORARY dev workflow for the luajit-cmake-build branch. Builds only the
# LuaJIT library and the TestsProcessor target and runs ctest on all three
# platforms -- no plugin formats, pluginval, packaging or signing. It exists
# purely to iterate on Source/Misc/luajit/CMakeLists.txt over CI, where the
# Windows and macOS legs cannot be checked locally.
#
# DELETE THIS FILE before folding the branch into 8.0.0_testing, together with
# the branches-ignore entry added to build_and_test.yml.

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run with tmate debugging enabled on failure'
        required: false
        default: false
  push:
    branches:
      - luajit-cmake-build

concurrency:
  group: luajit-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  BUILD_DIR: build
  SCCACHE_GHA_ENABLED: true
  SCCACHE_CACHE_MULTIARCH: 1

defaults:
  run:
    shell: bash

jobs:
  luajit:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            extra-flags: -G Ninja -DJUCE_LINUX=1
            allow: Tests/known_failures_linux.txt
            python: python3
          - name: macOS
            os: macos-14
            extra-flags: -G Ninja -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            allow: Tests/known_failures_macos.txt
            python: python3
          - name: Windows
            os: windows-2022
            extra-flags: ""
            allow: Tests/known_failures_windows.txt
            python: python

    steps:
      - name: Setup MSVC (Windows)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Clang (Linux)
        if: runner.os == 'Linux'
        uses: egor-tensin/setup-clang@v1

      - name: Install JUCE's Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt install -y \
            libasound2-dev libx11-dev libxinerama-dev libxext-dev \
            libfreetype6-dev libglu1-mesa-dev xvfb ninja-build \
            binutils-dev libboost-dev libcurl4-gnutls-dev libgl1-mesa-dev \
            libglapi-mesa libiberty-dev libsframe1 libudev-dev \
            libxcursor-dev libxrandr-dev xorg-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev unzip
          sudo ln -sf /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc \
                      /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Install macOS deps
        if: matrix.name == 'macOS'
        run: brew install boost

      - name: Use latest Xcode on system (macOS)
        if: matrix.name == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Unzip Boost
        if: runner.os != 'Linux'
        run: |
          BOOST_ZIP=$(find . -name "boost.zip" | head -n 1)
          if [ -n "$BOOST_ZIP" ]; then
            unzip -q -o "$BOOST_ZIP" -d "./Source/Misc/"
          else
            echo "boost.zip not found, skipping extraction"
          fi

      - name: Cache the build
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: >
          cmake -B ${{ env.BUILD_DIR }}
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCTRLRX_USE_LUAJIT=ON
          ${{ matrix.extra-flags }} .

      # Build LuaJIT on its own first, so a bootstrap failure is reported as a
      # LuaJIT failure rather than buried in the CtrlrX build.
      - name: Build LuaJIT only
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }} --target libluajit

      - name: Show what was produced
        run: |
          find ${{ env.BUILD_DIR }} -name 'gen' -type d -prune -exec find {} -type f \; | sort
          echo "--- library ---"
          find ${{ env.BUILD_DIR }} \( -name 'luajit*.a' -o -name 'luajit*.lib' \) -exec ls -l {} \;
          if [ "$RUNNER_OS" == "macOS" ]; then
            find ${{ env.BUILD_DIR }} -name 'libluajit.a' -exec lipo -info {} \;
          fi

      - name: Build TestsProcessor
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }} --target TestsProcessor -j 4

      - name: Test
        continue-on-error: true
        working-directory: ${{ env.BUILD_DIR }}/Tests
        env:
          GTEST_OUTPUT: "xml:test-results/"
        run: |
          rm -rf test-results && mkdir -p test-results
          ctest -j 4 --output-on-failure -C ${{ env.BUILD_TYPE }}

      - name: Evaluate results (excluding known failures)
        run: ${{ matrix.python }} Tests/ci_check_test_results.py --allow ${{ matrix.allow }} "${{ env.BUILD_DIR }}/Tests/test-results/**/*.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luajit-test-results-${{ matrix.name }}
          path: ${{ env.BUILD_DIR }}/Tests/test-results/
          if-no-files-found: warn

      - name: Setup tmate session if failed
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() && (github.event_name == 'workflow_dispatch' && inputs.debug_enabled) || (runner.debug) }}
